name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 单元测试与渲染测试
        run: node --test tests/
      - name: DOM 静态检查
        run: node tools/check-dom.mjs
      - name: 单文件打包冒烟
        run: node tools/build-standalone.mjs
