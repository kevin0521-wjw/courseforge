name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 只为启用 jsdom 全流程用例（可选依赖）；产物本身仍然零依赖
      - name: 安装测试依赖
        run: npm install --no-audit --no-fund
      - name: 单元测试与渲染测试
        # Node 22 的 --test 不认「目录」参数（node --test tests/ 会报 MODULE_NOT_FOUND，
        # 导致 CI 直接红），必须不带参数让它自动发现 *.test.(mjs|cjs)。
        # jsdom 的定时器由测试内的 window.close() 清理，无需 --test-force-exit 强杀。
        run: node --test
      - name: DOM / data-action / CSS 静态检查
        run: node tools/check-dom.mjs
      - name: 变异测试（确认断言真的会变红）
        # 故意改坏被测代码，验证护栏有效 —— 防的是「断言恒真、等于没写」。
        # 本地实测约 3.5 分钟；脚本监听 SIGTERM，被强杀也会还原源码。
        run: node tools/mutation-check.mjs
      - name: 单文件打包冒烟
        run: node tools/build-standalone.mjs
