name: 💡 功能建议
description: 提出一个你想要的新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。先说明一下这个项目的取舍原则，能帮你判断建议是否可行：

        - 项目**零外部依赖**，不引框架 / CDN / 字体库
        - 数据**默认全部留在本地**，不做任何上传
        - 优先做**"每天都会用到"**的功能，而不是功能列表上的凑数项

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 请先描述场景和痛点，而不是直接给方案 —— 有时换个做法能更好解决
      placeholder: 例如：每周日晚上我都要手动核对下周有没有调休补课，容易漏掉
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么解决
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他做法（可选）
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: 请确认
      options:
        - label: 这个建议不需要引入外部依赖，也不需要把数据上传到服务器
          required: false
        - label: 我愿意自己提 PR 来实现（可选，不代表必须）
          required: false
